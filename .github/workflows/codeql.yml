name: "CodeQL"

# Thin caller of the decaf-ts reusable CodeQL analysis action
# (decaf-ts/reusable-actions). Scanning only — never gates a release.

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "41 0 * * 4"
  workflow_dispatch:

jobs:
  analyze:
    uses: decaf-ts/reusable-actions/.github/workflows/codeql-analysis.yml@8896e8b258d40f7e8cbddb0f28ba3d7ff61cda13 # master
    secrets: inherit
