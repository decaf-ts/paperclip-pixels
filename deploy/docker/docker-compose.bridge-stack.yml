# Docker-compose fallback for the Paperclip Pixel Agents bridge stack.
#
# Use this when minikube/k8s is unavailable. It mirrors the k8s manifests in
# deploy/k8s/ one-to-one. Build the plugin packages first, then the images
# (from the repo root; each Dockerfile vendors its own plugin artifact):
#
#   npm --prefix common run build \
#     && npm --prefix plugins/paperclip run build \
#     && npm --prefix plugins/pixel-agents run build   # plugin bundles + embedding module
#   docker build -t paperclip-pixel-host:local \
#     -f deploy/docker/Dockerfile.paperclip-pixel-host .
#   docker build -t pixel-agents:local \
#     -f deploy/docker/Dockerfile.pixel-agents .
#
# Then:
#   PAPERCLIP_AUTH_SECRET=$(openssl rand -hex 32) \
#   PAPERCLIP_PIXEL_FEED_TOKEN=$(openssl rand -hex 32) \
#   PAPERCLIP_PIXEL_API_TOKEN=<board-api-key> \
#     docker compose -f deploy/docker/docker-compose.bridge-stack.yml up
#
# Reach the UIs:
#   Paperclip:   http://localhost:3100
#   Pixel Agents: http://localhost:8080
#
# NOTE: the Paperclip host runs in `authenticated` mode. The bridge plugin is
# installed at first boot by the loopback-bootstrap entrypoint baked into the
# paperclip-pixel-host image (no manual admin step). See deploy/README.md.
#
# The pixel-agents container loads the Paperclip bridge embedding module
# through the fork CLI's generic --plugin loader: the plugin registers
# in-process and the feed endpoint (POST /api/plugin-feed) listens on :8081
# (container-to-container; not published to the host). PAPERCLIP_PIXEL_FEED_TOKEN
# is the shared secret the Paperclip side configures as its
# pixelAgentsTokenRef secret — the feed endpoint is fail-closed and refuses
# to start without it. PAPERCLIP_PIXEL_API_TOKEN (a board API key) powers the
# click-menu reply forwarder; without it the rest works but replies fail
# closed with forwarderNotConfigured.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip
      POSTGRES_DB: paperclip
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      timeout: 3s
      retries: 20

  paperclip:
    image: paperclip-pixel-host:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.paperclip-pixel-host
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3100:3100"
    environment:
      HOST: "0.0.0.0"
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_BIND: "lan"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "http://localhost:3100"
      # The pixel-agents container reaches the API at its compose service
      # name (PAPERCLIP_PIXEL_API_BASE_URL=http://paperclip:3100 — the
      # click-menu reply forwarder's target). The host allowlist rejects
      # unknown Host headers with 403, so the in-network service name must
      # be explicitly allowed (additive with the PUBLIC_URL hostname).
      PAPERCLIP_ALLOWED_HOSTNAMES: "paperclip"
      PAPERCLIP_HOME: "/paperclip"
      PAPERCLIP_INSTANCE_ID: "default"
      PAPERCLIP_CONFIG: "/paperclip/instances/default/config.json"
      PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
      PAPERCLIP_BOOTSTRAP_PORT: "3101"
      PAPERCLIP_PIXEL_PLUGIN_PATH: "/opt/paperclip-pixel-plugin"
      DATABASE_URL: "postgres://paperclip:paperclip@db:5432/paperclip"
      BETTER_AUTH_SECRET: "${PAPERCLIP_AUTH_SECRET:?set PAPERCLIP_AUTH_SECRET}"
      # Relay-feed wiring (SAA-961 Finding 2): the worker->feed push is
      # company-scoped plugin config. Pass the same feed token + feed URL +
      # allowed cleartext hosts to the host so the baked-in bootstrap init
      # (deploy/scripts/init-company.sh) can register the token as a company
      # secret and apply the plugin config on first boot (best-effort) or via
      # the documented one-time `docker compose exec paperclip
      # /usr/local/bin/init-company.sh http://127.0.0.1:3100` after the first
      # company exists.
      PAPERCLIP_PIXEL_FEED_TOKEN: "${PAPERCLIP_PIXEL_FEED_TOKEN:?set PAPERCLIP_PIXEL_FEED_TOKEN}"
      PAPERCLIP_PIXEL_FEED_URL: "http://pixel-agents:8081"
      PAPERCLIP_PIXEL_ALLOWED_HTTP_HOSTS: "pixel-agents"
    volumes:
      - paperclip-data:/paperclip

  pixel-agents:
    image: pixel-agents:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.pixel-agents
    ports:
      - "8080:8080"
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8080",
        "--plugin", "/opt/paperclip-pixel-embedding/pixel-agents-embedding.cjs",
      ]
    environment:
      PAPERCLIP_PIXEL_FEED_HOST: "0.0.0.0"
      PAPERCLIP_PIXEL_FEED_PORT: "8081"
      PAPERCLIP_PIXEL_FEED_TOKEN: "${PAPERCLIP_PIXEL_FEED_TOKEN:?set PAPERCLIP_PIXEL_FEED_TOKEN (shared secret for the plugin feed endpoint; configure the same value as the Paperclip plugin's pixelAgentsTokenRef secret)}"
      PAPERCLIP_PIXEL_API_BASE_URL: "http://paperclip:3100"
      PAPERCLIP_PIXEL_API_TOKEN: "${PAPERCLIP_PIXEL_API_TOKEN:-}"

volumes:
  pgdata:
  paperclip-data:

