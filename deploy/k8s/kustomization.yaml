apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperclip-pixels
resources:
  - namespace.yaml
  - postgres.yaml
  - paperclip.yaml
  - pixel-agents.yaml
images:
  - name: paperclip-pixel-host
    newName: paperclip-pixel-host
    newTag: local
  - name: pixel-agents
    newName: pixel-agents
    newTag: local
