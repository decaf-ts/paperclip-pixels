apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperclip-pixels
resources:
  - namespace.yaml
  - postgres.yaml
  - paperclip.yaml
  - pixel-agents.yaml
# Secret values are generated from the git-ignored `secrets.env` file — no
# secret material is committed. Copy secrets.env.example to secrets.env and
# fill it in before applying.
secretGenerator:
  - name: paperclip-secrets
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true
  - name: postgres-credentials
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true
  - name: paperclip-pixel-feed
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true
images:
  - name: paperclip-pixel-host
    newName: paperclip-pixel-host
    newTag: local
  - name: pixel-agents
    newName: pixel-agents
    newTag: local
