apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixel-agents
  namespace: paperclip-pixels
spec:
  replicas: 1
  selector:
    matchLabels: { app: pixel-agents }
  template:
    metadata:
      labels: { app: pixel-agents }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: pixel-agents
          # Built locally from docker/Dockerfile.pixel-agents and loaded into
          # minikube with `minikube image load`. Never pulled from a registry.
          # The fork CLI is provider-agnostic; the Paperclip bridge rides its
          # generic --plugin loader (deploy/README.md) — all Paperclip glue
          # lives in the vendored embedding module, in-process.
          image: pixel-agents:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
            # Plugin feed endpoint (POST /api/plugin-feed) served by the
            # embedding module's sidecar listener — the destination the
            # Paperclip relay's pixelAgentsUrl points at (cluster-internal
            # only; no external Service exposure).
            - containerPort: 8081
              name: plugin-feed
          # The standalone CLI takes --host/--port/--plugin flags (no env
          # override). Bind 0.0.0.0 so it is reachable via the pod IP /
          # port-forward (the CLI default 127.0.0.1 is unreachable in k8s).
          args:
            [
              "--host", "0.0.0.0",
              "--port", "8080",
              "--plugin", "/opt/paperclip-pixel-embedding/pixel-agents-embedding.cjs",
            ]
          env:
            - name: HOME
              value: /home/node
            # Feed listener: cross-pod traffic (arrives via the Service
            # ClusterIP from the Paperclip pod), so bind the wildcard.
            - name: PAPERCLIP_PIXEL_FEED_HOST
              value: "0.0.0.0"
            - name: PAPERCLIP_PIXEL_FEED_PORT
              value: "8081"
            # Shared secret for the feed endpoint (fail-closed: the embedding
            # module refuses to start without it). Configure the same value
            # as the Paperclip plugin's pixelAgentsTokenRef secret.
            - name: PAPERCLIP_PIXEL_FEED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paperclip-pixel-feed
                  key: PAPERCLIP_PIXEL_FEED_TOKEN
            # Click-menu reply forwarder target (the Paperclip API Service)
            # and its board API key. Optional: without the key the feed still
            # applies, replies fail closed with forwarderNotConfigured.
            - name: PAPERCLIP_PIXEL_API_BASE_URL
              value: http://paperclip.paperclip-pixels.svc.cluster.local:3100
            - name: PAPERCLIP_PIXEL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paperclip-pixel-feed
                  key: PAPERCLIP_PIXEL_API_TOKEN
                  optional: true
          readinessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: pixel-agents
  namespace: paperclip-pixels
spec:
  selector: { app: pixel-agents }
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 8081
      targetPort: 8081
      name: plugin-feed
