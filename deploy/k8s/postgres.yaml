apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: paperclip-pixels
type: Opaque
stringData:
  POSTGRES_USER: paperclip
  POSTGRES_PASSWORD: paperclip
  POSTGRES_DB: paperclip
  # Full DATABASE_URL consumed by the paperclip host.
  DATABASE_URL: postgres://paperclip:paperclip@postgres:5432/paperclip
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: paperclip-pixels
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: paperclip-pixels
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "paperclip", "-d", "paperclip"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "paperclip", "-d", "paperclip"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: paperclip-pixels
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
