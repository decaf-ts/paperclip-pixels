{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paperclip-pixels.fullname" . }}-secrets
  namespace: {{ include "paperclip-pixels.namespace" . }}
  labels:
    {{- include "paperclip-pixels.labels" . | nindent 4 }}
type: Opaque
stringData:
  BETTER_AUTH_SECRET: {{ required "secrets.betterAuthSecret is required (or set secrets.existingSecret)" .Values.secrets.betterAuthSecret | quote }}
  PAPERCLIP_PIXEL_FEED_TOKEN: {{ required "secrets.feedToken is required (or set secrets.existingSecret)" .Values.secrets.feedToken | quote }}
  {{- if .Values.secrets.apiToken }}
  PAPERCLIP_PIXEL_API_TOKEN: {{ .Values.secrets.apiToken | quote }}
  {{- end }}
  POSTGRES_USER: {{ required "secrets.postgresUser is required (or set secrets.existingSecret)" .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required (or set secrets.existingSecret)" .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ required "secrets.postgresDatabase is required (or set secrets.existingSecret)" .Values.secrets.postgresDatabase | quote }}
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- else }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.secrets.postgresUser .Values.secrets.postgresPassword (include "paperclip-pixels.fullname" .) .Values.secrets.postgresDatabase | quote }}
  {{- end }}
  {{- if .Values.global.tls.feedCA }}
  FEED_CA: {{ .Values.global.tls.feedCA | quote }}
  {{- end }}
  {{- if .Values.global.tls.feedServerCert }}
  FEED_SERVER_CERT: {{ .Values.global.tls.feedServerCert | quote }}
  {{- end }}
  {{- if .Values.global.tls.feedServerKey }}
  FEED_SERVER_KEY: {{ .Values.global.tls.feedServerKey | quote }}
  {{- end }}
  {{- if .Values.global.tls.feedClientCert }}
  FEED_CLIENT_CERT: {{ .Values.global.tls.feedClientCert | quote }}
  {{- end }}
  {{- if .Values.global.tls.feedClientKey }}
  FEED_CLIENT_KEY: {{ .Values.global.tls.feedClientKey | quote }}
  {{- end }}
{{- else }}
# secrets.existingSecret is set; the chart references the externally managed
# Secret {{ .Values.secrets.existingSecret }} and does not render secret material.
{{- end }}
