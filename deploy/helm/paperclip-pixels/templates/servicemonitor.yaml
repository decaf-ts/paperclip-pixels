{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitors }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "paperclip-pixels.fullname" . }}
  namespace: {{ include "paperclip-pixels.namespace" . }}
  labels:
    {{- include "paperclip-pixels.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "paperclip-pixels.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: paperclip
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "paperclip-pixels.fullname" . }}-pixel-agents
  namespace: {{ include "paperclip-pixels.namespace" . }}
  labels:
    {{- include "paperclip-pixels.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "paperclip-pixels.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pixel-agents
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
{{- end }}
